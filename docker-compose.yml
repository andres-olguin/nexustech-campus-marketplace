services:
  postgres:
    image: postgres:16-alpine
    container_name: nexustech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexustech
      POSTGRES_USER: nexustech
      POSTGRES_PASSWORD: nexustech_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexustech -d nexustech"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: nexustech-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: nexustech
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexustech-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: nexustech
      DATABASE_PASSWORD: nexustech_dev_password
      DATABASE_NAME: nexustech
      MONGODB_URI: mongodb://mongodb:27017/nexustech
      MONGODB_DB_NAME: nexustech
      JWT_SECRET: nexustech_development_secret_key_at_least_32_chars_long
      CORS_ORIGINS: http://localhost:5173,http://localhost:80,http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./nexustech-react
      dockerfile: Dockerfile
    container_name: nexustech-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
