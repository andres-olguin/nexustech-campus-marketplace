services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexustech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexustech
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexustech -d nexustech"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: nexustech
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u nexustech -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'" ]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - mongo_data:/data/db

  api:
    build: ./backend
    environment:
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: nexustech
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: nexustech
      MONGODB_URI: mongodb://nexustech:${MONGO_PASSWORD}@mongo:27017/nexustech?authSource=admin
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  web:
    build: ./nexustech-react
    environment:
      VITE_API_BASE_URL: http://localhost:3001/api/v1
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:

