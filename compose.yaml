services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexustech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexustech
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexustech -d nexustech"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  api:
    build: ./backend
    environment:
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: nexustech
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: nexustech
      MONGODB_URI: mongodb://mongo:27017/nexustech
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started

  web:
    build: ./nexustech-react
    environment:
      VITE_API_BASE_URL: http://localhost:3001/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  mongo_data:

